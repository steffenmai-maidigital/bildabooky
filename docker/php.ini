upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
expose_php = Off

; Keine Funktionsargumente in Stacktraces (sonst Passwörter im Protokoll)
; No function arguments in stack traces (otherwise passwords in the log)
zend.exception_ignore_args = On
display_errors = Off
display_startup_errors = Off
log_errors = On
